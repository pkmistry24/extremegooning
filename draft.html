<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Draft Board | Sleeper Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-panel: #141414;
            --bg-card: #1c1c1c;
            --accent-red: #e31937;
            --accent-yellow: #ffd700;
            --accent-dim: #7a0f1e;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-muted: #444444;
            --border-dark: #2a2a2a;
            --glow-red: rgba(227, 25, 55, 0.35);
            --glow-gold: rgba(255, 215, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Oswald', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .stripe {
            height: 12px;
            background-image: repeating-linear-gradient(
                90deg,
                #fff 0px, #fff 12px,
                #000 12px, #000 24px
            );
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 36px 16px 56px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header::after {
            content: '';
            display: block;
            margin: 20px auto 0;
            width: 100px;
            height: 3px;
            background: var(--accent-red);
            box-shadow: 0 0 16px var(--glow-red);
        }

        .title-main {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.6rem, 12vw, 5.5rem);
            letter-spacing: clamp(4px, 2vw, 10px);
            color: var(--text-primary);
            text-shadow: 0 0 60px var(--glow-red), 0 0 120px var(--accent-dim);
            line-height: 1;
        }

        .title-sub {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: clamp(0.65rem, 2.5vw, 1rem);
            letter-spacing: clamp(6px, 3vw, 14px);
            color: var(--accent-red);
            text-transform: uppercase;
            margin-top: 8px;
        }

        .title-tagline {
            font-size: clamp(0.65rem, 2vw, 0.85rem);
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-top: 10px;
            text-transform: uppercase;
        }

        .nav-link {
            display: block;
            text-align: center;
            margin-bottom: 28px;
        }

        .nav-link a {
            color: var(--text-secondary);
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            border-bottom: 1px solid var(--border-dark);
            padding-bottom: 2px;
        }

        .nav-link a:hover { color: var(--accent-red); border-color: var(--accent-red); }

        .status-box {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .status-box p {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-box.error p { color: var(--accent-red); }

        .draft-meta {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .meta-pill {
            background: var(--bg-panel);
            border: 1px solid var(--border-dark);
            padding: 8px 14px;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .round-block {
            margin-bottom: 22px;
        }

        .round-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 10px 4px;
            border-bottom: 1px solid var(--border-dark);
            margin-bottom: 8px;
        }

        .round-header .round-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 3px;
            color: var(--accent-red);
        }

        .round-header .round-label {
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .pick-list { display: flex; flex-direction: column; gap: 3px; }

        .pick-row {
            display: grid;
            grid-template-columns: 40px 32px 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 12px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-dark);
            border-left: 3px solid transparent;
        }

        .pick-no {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.3rem;
            color: var(--text-muted);
            line-height: 1;
        }

        .team-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-panel);
            border: 1px solid var(--border-dark);
        }

        .pick-team {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .pick-owner {
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-top: 2px;
            text-transform: uppercase;
        }

        .pick-player {
            text-align: right;
        }

        .pick-player .name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 1px;
            color: var(--accent-red);
            line-height: 1.2;
        }

        .pick-player .pos {
            font-size: 0.6rem;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .footer {
            text-align: center;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border-dark);
        }

        .footer-attr {
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        @media (min-width: 600px) {
            .container { padding: 48px 24px 64px; }
        }
    </style>
</head>
<body>

<div id="password-gate" style="
    position:fixed;inset:0;background:#0a0a0a;z-index:9999;
    display:flex;align-items:center;justify-content:center;padding:24px;
">
    <div style="
        background:#141414;border:1px solid #2a2a2a;border-top:3px solid #e31937;
        padding:40px 32px;width:100%;max-width:400px;text-align:center;
    ">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:2.5rem;letter-spacing:6px;color:#fff;text-shadow:0 0 40px rgba(227,25,55,0.4);">DRAFT BOARD</div>
        <div style="font-size:0.7rem;letter-spacing:4px;color:#e31937;text-transform:uppercase;margin:8px 0 32px;">Members Only</div>
        <input id="gate-input" type="password" placeholder="Password" autocomplete="off" style="
            width:100%;background:#0a0a0a;border:1px solid #2a2a2a;color:#fff;
            font-family:'Oswald',sans-serif;font-size:1rem;padding:14px;
            outline:none;margin-bottom:10px;border-radius:0;-webkit-appearance:none;
            text-align:center;letter-spacing:3px;
        ">
        <div id="gate-error" style="color:#e31937;font-size:0.7rem;letter-spacing:2px;min-height:16px;margin-bottom:10px;"></div>
        <button id="gate-btn" style="
            width:100%;background:#e31937;color:#fff;border:none;
            font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:4px;
            padding:18px;cursor:pointer;min-height:56px;
            -webkit-appearance:none;border-radius:0;touch-action:manipulation;
        ">ENTER</button>
    </div>
</div>

<script>
    (function() {
        function checkPassword() {
            var val = document.getElementById('gate-input').value;
            if (val === 'Gooning4TheChampionship') {
                document.getElementById('password-gate').style.display = 'none';
                try { sessionStorage.setItem('wos_auth', '1'); } catch(e) {}
            } else {
                document.getElementById('gate-error').textContent = 'Wrong password. Try again.';
                document.getElementById('gate-input').value = '';
            }
        }

        var authed = false;
        try { authed = sessionStorage.getItem('wos_auth') === '1'; } catch(e) {}
        if (authed) {
            document.getElementById('password-gate').style.display = 'none';
        }

        document.getElementById('gate-btn').addEventListener('click', checkPassword);
        document.getElementById('gate-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    })();
</script>

<div class="stripe"></div>

<div class="container">
    <div class="nav-link"><a href="index.html">&larr; Wall of Shame</a> &nbsp;|&nbsp; <a href="draft-analyzer.html">Draft Grades</a> &nbsp;|&nbsp; <a href="rosters.html">Rosters</a></div>

    <header class="header">
        <div class="title-main">DRAFT BOARD</div>
        <div class="title-sub">Sleeper Draft Results</div>
        <div class="title-tagline" id="league-tagline">Loading league&hellip;</div>
    </header>

    <div id="content">
        <div class="status-box" id="status">
            <p>Pulling draft results from Sleeper&hellip;</p>
        </div>
    </div>

    <footer class="footer">
        <p class="footer-attr">Draft Board &mdash; Powered by the Sleeper API</p>
    </footer>
</div>

<div class="stripe"></div>

<script>
    const LEAGUE_ID = '1388232394384883712';
    const API = 'https://api.sleeper.app/v1';

    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const taglineEl = document.getElementById('league-tagline');

    function showError(msg) {
        contentEl.innerHTML = `<div class="status-box error"><p>${msg}</p></div>`;
    }

    async function fetchJSON(path) {
        const res = await fetch(`${API}${path}`);
        if (!res.ok) throw new Error(`Request failed: ${path}`);
        return res.json();
    }

    async function load() {
        try {
            const league = await fetchJSON(`/league/${LEAGUE_ID}`);
            taglineEl.textContent = `${league.name} · ${league.season} Season`;

            const drafts = await fetchJSON(`/league/${LEAGUE_ID}/drafts`);
            if (!drafts.length) {
                showError('No drafts found for this league yet.');
                return;
            }
            const draft = drafts[0];

            const [picks, users] = await Promise.all([
                fetchJSON(`/draft/${draft.draft_id}/picks`),
                fetchJSON(`/league/${LEAGUE_ID}/users`)
            ]);

            if (!picks.length) {
                showError('Draft found, but no picks have been made yet.');
                return;
            }

            const userMap = {};
            users.forEach(u => {
                userMap[u.user_id] = {
                    team: (u.metadata && u.metadata.team_name) || u.display_name,
                    owner: u.display_name,
                    avatar: u.avatar ? `https://sleepercdn.com/avatars/thumbs/${u.avatar}` : null
                };
            });

            const rounds = {};
            picks.forEach(p => {
                if (!rounds[p.round]) rounds[p.round] = [];
                rounds[p.round].push(p);
            });

            const roundNums = Object.keys(rounds).map(Number).sort((a, b) => a - b);

            const metaHtml = `
                <div class="draft-meta">
                    <div class="meta-pill">${draft.settings.teams} Teams</div>
                    <div class="meta-pill">${draft.type} Draft</div>
                    <div class="meta-pill">${draft.settings.rounds} Rounds</div>
                    <div class="meta-pill">${draft.status}</div>
                </div>`;

            const roundsHtml = roundNums.map(rn => {
                const roundPicks = rounds[rn].sort((a, b) => a.pick_no - b.pick_no);
                const rows = roundPicks.map(p => {
                    const u = userMap[p.picked_by] || { team: 'Unknown', owner: '' };
                    const meta = p.metadata || {};
                    const playerName = meta.first_name ? `${meta.first_name} ${meta.last_name}` : (meta.last_name || 'N/A');
                    const posTeam = [meta.position, meta.team].filter(Boolean).join(' · ');
                    return `
                        <div class="pick-row">
                            <div class="pick-no">${p.pick_no}</div>
                            <img class="team-avatar" src="${u.avatar || 'https://sleepercdn.com/images/v2/icons/player_default.webp'}" alt="" loading="lazy">
                            <div>
                                <div class="pick-team">${u.team}</div>
                                ${u.owner && u.owner !== u.team ? `<div class="pick-owner">${u.owner}</div>` : ''}
                            </div>
                            <div class="pick-player">
                                <div class="name">${playerName}</div>
                                <div class="pos">${posTeam}</div>
                            </div>
                        </div>`;
                }).join('');
                return `
                    <div class="round-block">
                        <div class="round-header">
                            <span class="round-num">R${rn}</span>
                            <span class="round-label">Round ${rn} of ${draft.settings.rounds}</span>
                        </div>
                        <div class="pick-list">${rows}</div>
                    </div>`;
            }).join('');

            contentEl.innerHTML = metaHtml + roundsHtml;
        } catch (err) {
            console.error(err);
            showError('Could not load draft results. Check the league ID or try again later.');
        }
    }

    load();
</script>
</body>
</html>
